<app-global-modal></app-global-modal>
@if (notificationService.visible()) {
  <div class="position-fixed bottom-0 end-0 p-4" style="z-index: 2000; pointer-events: none;">
    <div class="toast show border-0 shadow-lg overflow-hidden animate-slide-up"
      [ngClass]="notificationService.tipo() === 'success' ? 'bg-success text-white' : 'bg-danger text-white'"
      style="pointer-events: auto; min-width: 320px; border-radius: 12px;">

      <div class="d-flex align-items-center p-3 gap-3">
        <!-- Ícono -->
        <div class="d-flex align-items-center justify-content-center bg-white bg-opacity-25 rounded-circle p-2"
          style="width: 38px; height: 38px;">
          <i class="bi fs-5"
            [ngClass]="notificationService.tipo() === 'success' ? 'bi-check-circle-fill' : 'bi-trash-fill'"></i>
        </div>

        <!-- Mensaje -->
        <div class="flex-grow-1">
          <div class="fw-bold small text-uppercase tracking-wider opacity-75">
            {{ notificationService.tipo() === 'success' ? 'Éxito' : (notificationService.tipo() === 'delete' ? 'Eliminado' : 'Atención') }}
          </div>
          <div class="fw-semibold text-break" style="font-size: 0.95rem; line-height: 1.3;">
            {{ notificationService.mensaje() }}
          </div>
        </div>

        <!-- Botón de cierre -->
        <button type="button" class="btn-close btn-close-white shadow-none m-0"
          (click)="notificationService.visible.set(false)" aria-label="Cerrar">
        </button>
      </div>

      <!-- Barra de progreso -->
      <div class="progress bg-black bg-opacity-25" style="height: 3px;">
        <div class="progress-bar bg-white progress-bar-striped progress-bar-animated" role="progressbar"
          style="width: 100%; transition: width 3.5s linear;"
          [style.width.px]="notificationService.visible() ? 0 : 320">
        </div>
      </div>

    </div>
  </div>
  }
